name: CZT Strip Detector (full 39 anodes / steering / 8 cathodes)

units:
  length: mm
  angle: deg
  potential: V
  temperature: K

grid:
  coordinates: cartesian
  axes:
    x:
      from: -22
      to: 22
      boundaries:
        left: reflecting
        right: reflecting
    y:
      from: -22
      to: 22
      boundaries:
        left: reflecting
        right: reflecting
    z:
      from: -4
      to: 4
      boundaries:
        left: reflecting
        right: reflecting

medium: vacuum

detectors:
  - semiconductor:
      material: CdZnTe
      temperature: 293
      geometry:
        box:
          widths: [40, 40, 5]
      charge_drift_model:
        model: IsotropicChargeDriftModel
        mobilities:
          e: 1000cm^2/(V*s)
          h: 50cm^2/(V*s)
      impurity_density:
        name: constant
        value: 0
      charge_trapping_model:
        model: ConstantLifetime
        parameters:
          τe: 10μs
          τh: 1μs

